spring.application.name=biling-usage-platform
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_usage_platform
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Use the latest Postgres dialect for performance optimizations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Hibernate DDL generation
spring.jpa.hibernate.ddl-auto=none

# Enable Flyway
spring.flyway.enabled=true
# Default location is classpath:db/migration
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
